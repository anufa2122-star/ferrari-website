<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Registration</title>

    <style>
        body{
            background-color:black;
            color:white;
        }

        h1{
            color:goldenrod;
            padding:20px;
        }

        table{
            text-align:center;
            color:silver;
            border:2px solid goldenrod;
        }
         h3{
            text-align:center;
            padding:20px;
            color:goldenrod;
        }

        th{
            background-color:goldenrod;
            color:black;
            padding:10px;
        }

        td{
            background-color:#1a1a1a;
            padding:10px;
        }

        input{
            padding:8px;
            border:2px solid goldenrod;
        }

        select{
            padding:8px;
            border:2px solid goldenrod;
        }

        textarea{
            padding:8px;
            border:2px solid goldenrod;
        }

        input[type="submit"]{
            background-color:rgb(115, 9, 9);
            color:white;
            padding:10px 20px;
            border:2px solid goldenrod;
        }

        input[type="reset"]{
            background-color:rgb(115, 9, 9);
            color:white;
            padding:10px 20px;
            border:2px solid goldenrod;
        }
      

h3{
    text-align:center;
    padding:20px;
    color:goldenrod;
}

h3 a{
    color:goldenrod !important;
}


    </style>

</head>

<body>
    <h3>
    <a href="index.html">HOME</a> |
    <a href="about.html">ABOUT FERRARI</a> |
    <a href="Ferrari.html">COLLECTIONS</a> |
    <a href="features.html">FEATURES</a> |
    <a href="register.html">REGISTER</a> |
    <a href="index.html#contact">CONTACT</a>
</h3>

<center>

    <h1>FERRARI REGISTRATION ♞</h1>

    <form action="thankyou.html">

        <table border="1">

            <tr>
                <th>Name</th>
                <td>
                    <input type="text"
                           placeholder="Enter your name"
                           required>
                </td>
            </tr>

            <tr>
                <th>Email</th>
                <td>
                    <input type="email"
                           placeholder="Enter your email"
                           required>
                </td>
            </tr>

            <tr>
                <th>Mobile Number</th>
                <td>
                    <input type="number"
                           placeholder="Enter your mobile number"
                           required>
                </td>
            </tr>

            <tr>
                <th>Password</th>
                <td>
                    <input type="password"
                           placeholder="Enter your password"
                           required>
                </td>
            </tr>

            <tr>
                <th>Gender</th>
                <td>
                    <input type="radio"
                           name="gender"
                           value="male"
                           required> Male

                    <input type="radio"
                           name="gender"
                           value="female"> Female

                    <input type="radio"
                           name="gender"
                           value="other"> Other
                </td>
            </tr>

            <tr>
                <th>Select Ferrari Model</th>
                <td>
                    <select>
                        <option>Ferrari 296 GTB</option>
                        <option>Ferrari Roma</option>
                        <option>Ferrari SF90 Stradale</option>
                        <option>Ferrari Purosangue</option>
                    </select>
                </td>
            </tr>

            <tr>
                <th>Country</th>
                <td>
                    <select>
                        <option>India</option>
                        <option>Italy</option>
                        <option>United Kingdom</option>
                        <option>United States</option>
                    </select>
                </td>
            </tr>

            <tr>
                <th>Address</th>
                <td>
                    <textarea rows="4"
                              cols="30"
                              placeholder="Enter your address"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">

                    <input type="submit"
                           value="Register">

                    <input type="reset"
                           value="Reset">

                </td>
            </tr>

        </table>

    </form>

</center>

</body>
</html>
