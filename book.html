<!DOCTYPE html>
<html>
<head>
    <title>Ferrari Booking</title>
</head>

<body>

<center>

    <h1>FERRARI ♞</h1>

    <h2>Book Your Ferrari</h2>

    <p>Please fill out the form below to book your dream Ferrari:</p>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <label for="model">Ferrari Model:</label>

        <select id="model" name="model">

            <option value="250 GTO">Ferrari 250 GTO</option>
            <option value="F40">Ferrari F40</option>
            <option value="Enzo">Ferrari Enzo</option>
            <option value="LaFerrari">Ferrari LaFerrari</option>
            <option value="458 Italia">Ferrari 458 Italia</option>

        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br><br>

    <a href="Ferrari.html">Back to Ferrari Cars</a>

</center>

</body>
</html>
